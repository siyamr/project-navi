[project]
name = "project-navi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "siyamr", email = "57003413+siyamr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
navi-cli = "navi_server.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "navi_server"
module-root = "server"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["server", "client"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"